<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de headings</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f4f5f7;
      --surface:#ffffff;
      --surface-2:#f9fafb;
      --border:#e2e5ea;
      --border-2:#cdd2da;
      --text:#1c2333;
      --muted:#6b7585;
      --accent:#2563eb;
      --accent-soft:#eff4ff;
      --green:#15803d;
      --green-bg:#f0fdf4;
      --red:#dc2626;
      --red-bg:#fef2f2;
      --yellow:#b45309;
      --yellow-bg:#fffbeb;
      --mono:"IBM Plex Mono",monospace;
      --sans:"Lato",sans-serif;
      --r:12px;
      --shadow:0 1px 4px rgba(28,35,51,.07),0 4px 16px rgba(28,35,51,.06);
      --shadow-md:0 4px 20px rgba(28,35,51,.1);
    }

    html,body{min-height:100vh}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:36px 24px 64px;font-size:14px;line-height:1.5}

    .app{width:100%;max-width:1220px;margin:0 auto}

    /* Header */
    header{margin-bottom:32px}
    .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
    .brand-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    h1{font-family:var(--mono);font-size:clamp(22px,3.5vw,34px);font-weight:600;line-height:1.1;letter-spacing:-.02em;color:var(--text)}
    h1 em{font-style:normal;color:var(--accent)}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px}

    /* Layout */
    .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}

    /* Panel */
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .panel-head{padding:20px 20px 0}
    .panel-head h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px;color:var(--text)}
    .panel-body{padding:20px}
    .stack{display:grid;gap:16px}

    /* Form */
    .mode-tabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;margin-bottom:16px}
    .tab-btn{flex:1;appearance:none;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:6px;background:transparent;color:var(--muted);transition:.14s ease;font-weight:600}
    .tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(28,35,51,.1)}

    label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .field{margin-bottom:14px}
    input[type="url"],input[type="number"]{
      width:100%;background:var(--surface-2);border:1px solid var(--border-2);
      color:var(--text);border-radius:8px;padding:10px 12px;
      font-family:var(--mono);font-size:12px;
      transition:.14s ease;outline:none;
    }
    input[type="url"]:focus,input[type="number"]:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    input[type="number"]{appearance:textfield}
    .hidden{display:none!important}

    .btn{appearance:none;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-radius:8px;padding:10px 16px;transition:.15s ease}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:#1d4ed8}
    .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border-2)}
    .btn-secondary:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}
    .btn-danger{background:transparent;color:var(--red);border:1px solid rgba(220,38,38,.2)}
    .btn-danger:hover{background:var(--red-bg)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

    /* Jobs */
    .jobs-list{display:grid;gap:14px;padding:0 20px 20px}
    .empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border-2);border-radius:var(--r);font-size:13px}

    .job{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s}
    .job:hover{box-shadow:var(--shadow-md)}
    .job-head{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--border)}
    .job-left{flex:1;min-width:0}
    .job-title{font-size:13px;font-weight:700;word-break:break-all;margin-bottom:6px;color:var(--text)}
    .job-meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
    .job-right{display:flex;gap:8px;align-items:flex-start;flex-shrink:0}

    .status{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
    .estado-concluida{background:var(--green-bg);color:var(--green)}
    .estado-a_correr,.estado-pendente{background:var(--yellow-bg);color:var(--yellow)}
    .estado-erro,.estado-cancelada{background:var(--red-bg);color:var(--red)}

    .job-close{width:26px;height:26px;border-radius:999px;border:1px solid var(--border-2);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1;transition:.14s ease}
    .job-close:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}

    .progress-wrap{padding:0 16px 0}
    .progress-label{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
    .progress{height:4px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:14px}
    .progress>div{height:100%;width:0;background:var(--accent);transition:width .3s ease;border-radius:999px}
    @keyframes progress-indeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    .progress.indeterminate>div{width:25%!important;animation:progress-indeterminate 1.4s ease-in-out infinite;border-radius:999px}

    .job-body{padding:0 16px 16px}

    /* Summary cards */
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .s-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
    .s-num{font-family:var(--mono);font-size:20px;font-weight:600;margin-bottom:3px;color:var(--text)}
    .s-num.red{color:var(--red)}
    .s-num.green{color:var(--green)}
    .s-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

    /* Pages list */
    .pages-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .pages-header-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .filter-row{display:flex;gap:6px}
    .filter-btn{appearance:none;border:none;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:transparent;color:var(--muted);border:1px solid transparent;transition:.12s ease;font-weight:600}
    .filter-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(37,99,235,.15)}

    .page-item{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;transition:border-color .15s}
    .page-item.has-issues{border-color:rgba(220,38,38,.25)}
    .page-item-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--surface-2);user-select:none;transition:background .12s}
    .page-item-head:hover{background:var(--bg)}
    .copy-url-btn{appearance:none;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px;line-height:1;flex-shrink:0;border-radius:4px;transition:.12s ease}
    .copy-url-btn:hover{color:var(--accent);background:var(--accent-soft)}
    .show-all-btn{width:100%;appearance:none;border:1px dashed var(--border-2);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:8px;transition:.14s ease;margin-top:4px;font-weight:600}
    .show-all-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .page-chevron{font-size:10px;color:var(--muted);transition:transform .2s;flex-shrink:0}
    .page-item.open .page-chevron{transform:rotate(90deg)}
    .page-url{font-family:var(--mono);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
    .page-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0}
    .badge-ok{background:var(--green-bg);color:var(--green)}
    .badge-err{background:var(--red-bg);color:var(--red)}

    .page-content{display:none;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}
    .page-item.open .page-content{display:block}

    /* Heading tree */
    .heading-list{display:grid;gap:3px}
    .h-row{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:6px;transition:background .1s}
    .h-row:hover{background:var(--surface-2)}
    .h-row.h-error{background:var(--red-bg)}
    .h-indent{flex-shrink:0}
    .h-tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border-2);color:var(--muted);min-width:26px;text-align:center}
    .h-tag.h1{background:#eff4ff;color:var(--accent);border-color:rgba(37,99,235,.2)}
    .h-tag.h2{background:#f0fdf4;color:var(--green);border-color:rgba(21,128,61,.2)}
    .h-tag.h3{background:#fffbeb;color:var(--yellow);border-color:rgba(180,83,9,.2)}
    .h-tag.h4,.h-tag.h5,.h-tag.h6{background:var(--surface-2);color:var(--muted);border-color:var(--border-2)}
    .h-text{flex:1;font-size:12px;color:var(--text);word-break:break-word;line-height:1.4}
    .h-text.empty-text{color:var(--muted);font-style:italic}
    .h-issues{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
    .h-issue-badge{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,.2);white-space:nowrap}
    .h-issue-badge.warn-skip{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(180,83,9,.2)}
    .h-issue-badge.warn-deep{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(180,83,9,.2)}

    .page-error-msg{font-family:var(--mono);font-size:11px;color:var(--red);padding:8px 10px;background:var(--red-bg);border-radius:6px;word-break:break-word}

    /* Reports */
    .reports-list{display:grid;gap:8px;padding:0 20px 20px}
    .report-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px}
    .report-name{font-family:var(--mono);font-size:11px;word-break:break-all;margin-bottom:4px;color:var(--text)}
    .report-meta{font-size:11px;color:var(--muted)}
    .report-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .report-rename-row{display:none;gap:8px;align-items:center;margin-top:10px;grid-column:1/-1}
    .report-rename-row.open{display:flex}
    .report-rename-input{flex:1;background:var(--surface);border:1px solid var(--border-2);color:var(--text);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:11px}

    /* Toast */
    .toast{position:fixed;right:16px;bottom:16px;max-width:340px;background:var(--text);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease;z-index:90;font-size:13px}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.err{background:var(--red)}

    /* Info box */
    .info-box{background:var(--accent-soft);border:1px solid rgba(37,99,235,.15);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--accent);font-family:var(--mono);margin-top:12px}

    @media(max-width:1060px){.layout{grid-template-columns:1fr}}
    @media(max-width:640px){body{padding:16px 12px 48px}.summary{grid-template-columns:1fr 1fr}.jobs-list,.reports-list{padding:0 12px 16px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Verificador de headings</h1>
    </header>

    <section class="layout">
      <aside class="stack">
        <div class="panel">
          <div class="panel-head"><h2>Nova auditoria</h2></div>
          <div class="panel-body">

            <label>Modo</label>
            <div class="mode-tabs" id="modeToggle">
              <button type="button" class="tab-btn active" data-mode="single">Página única</button>
              <button type="button" class="tab-btn" data-mode="site">Site inteiro</button>
            </div>

            <div class="field">
              <label for="urlInput" id="urlLabel">URL da página</label>
              <input id="urlInput" type="url" placeholder="https://www.exemplo.pt/pagina">
            </div>

            <div class="field hidden" id="limitField">
              <label for="maxPaginas">Limite de páginas <span style="color:var(--muted);font-weight:400;text-transform:none;font-size:11px">(0 = sem limite)</span></label>
              <input id="maxPaginas" type="number" min="0" max="9999" value="0">
            </div>

            <div class="btn-row">
              <button class="btn btn-primary" id="submitBtn" type="button">Lançar auditoria</button>
              <button class="btn btn-secondary" id="clearBtn" type="button">Limpar</button>
            </div>
          </div>
        </div>
      </aside>

      <main class="stack">
        <div class="panel">
          <div class="panel-head"><h2>Resultados</h2></div>
          <div class="jobs-list" id="jobsList">
            <div class="empty">Ainda não há auditorias.</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Relatórios guardados</h2>
            <div class="btn-row" style="margin-top:0;margin-bottom:14px">
              <button class="btn btn-secondary" id="reportsRefreshBtn" type="button">Atualizar</button>
              <button class="btn btn-danger" id="reportsDeleteAllBtn" type="button">Apagar todos</button>
            </div>
          </div>
          <div class="reports-list" id="reportsList">
            <div class="empty">Nenhum relatório guardado.</div>
          </div>
        </div>
      </main>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="headings_app.js" defer></script>
</body>
</html>
